<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Tracking Pengiriman{% endblock %}</title>
  {# Tailwind lewat CDN cukup untuk pengembangan; untuk production sebaiknya di-build. #}
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="{{ url_for('static', path='css/tracking.css') }}">
  {# Urutan penting: Leaflet dan skrip halaman dulu, Alpine paling akhir. #}
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="{{ url_for('static', path='js/tracking-map.js') }}"></script>
  <script defer src="{{ url_for('static', path='js/tracking-page.js') }}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  {% block content %}{% endblock %}
</body>
</html>
