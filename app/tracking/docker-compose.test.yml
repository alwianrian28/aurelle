# PostgreSQL lokal KHUSUS testing. Datanya di memori (tmpfs) dan hilang saat container berhenti.
# Test tidak pernah dijalankan ke Supabase.
#
#   docker compose -f docker-compose.test.yml up -d
#   pytest
#   docker compose -f docker-compose.test.yml down
name: tracking-test
services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: tracking
      POSTGRES_DB: tracking_test
    ports:
      # Hanya dari mesin ini. 5433 sudah dipakai Postgres pengembangan Aurelle.
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking -d tracking_test"]
      interval: 2s
      timeout: 3s
      retries: 30
