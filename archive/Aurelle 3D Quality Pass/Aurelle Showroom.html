<script type="text/plain" id="m-diamond">import * as THREE from 'three';

// ---------------------------------------------------------------------------
// Cut geometry
// The stone is built as an intersection of half-spaces (one per polished
// facet) in a radius-normalised round-brilliant space, then stretched to an
// oval. The same planes drive the mesh and the optical shader, so the facets
// the camera sees are exactly the facets the rays bounce between.
// ---------------------------------------------------------------------------
const DEG=Math.PI/180;
// Reference proportions (GIA "excellent" range for a brilliant pattern).
export const CUT=Object.freeze({table:.57,crownAngle:34.5,pavilionAngle:40.8,starLength:.5,lowerHalfLength:.77,girdle:.03,culet:0})  // pointed culet: a flat culet reads as a black dot in face-up macro;
// Refractive index of diamond at ~650 / 550 / 450 nm (Sellmeier fit; B–G dispersion ≈ 0.044, as measured).

const v=(x,y,z)=>new THREE.Vector3(x,y,z);

 const b=Math.atan((hT-ys)/(rs-tm));              // star facet angle (~21°)

  const f=k*Math.PI/4,s=f+Math.PI/8,f2=f+Math.PI/4,S=polar(rs,s,ys),L=polar(rl,s,yl);
  P.push(plane(v(Math.sin(a)*Math.cos(f),Math.cos(a),Math.sin(a)*Math.sin(f)),polar(1,f,g)));      // bezel
  P.push(plane(v(Math.sin(b)*Math.cos(s),Math.cos(b),Math.sin(b)*Math.sin(s)),polar(tm,s,hT)));    // star
  P.push(plane3(S,polar(1,f,g),polar(1,s,g)),plane3(S,polar(1,s,g),polar(1,f2,g)));               // upper halves
  P.push(plane(v(Math.sin(p)*Math.cos(f),-Math.cos(p),Math.sin(p)*Math.sin(f)),polar(1,f,-g)));    // pavilion main
  P.push(plane3(L,polar(1,f,-g),polar(1,s,-g)),plane3(L,polar(1,s,-g),polar(1,f2,-g)));           // lower halves
 }

   let inside=true;for(let q=0;q<n;q++){if(N[q][0]*x+N[q][1]*y+N[q][2]*z>D[q]+1e-7){inside=false;break;}}
   if(inside&&!verts.some(w=>Math.abs(w.x-x)+Math.abs(w.y-y)+Math.abs(w.z-z)<1e-6))verts.push(v(x,y,z));

const roundCache=new Map();
function roundBrilliant(girdleFacets){if(!roundCache.has(girdleFacets))roundCache.set(girdleFacets,polytope(brilliantPlanes(girdleFacets)));return roundCache.get(girdleFacets);}

/** Oval/round brilliant. rx,rz: girdle radii. Depth scales with the width (rz). */
export function brilliantGeometry(rx=.505,rz=.365,{detailed=true}={}){

  const nn=f.plane.n.clone().multiply(inv),len=nn.length();nn.divideScalar(len);
  facets.push(new THREE.Vector4(nn.x,nn.y,nn.z,f.plane.d/len));
  const L=f.loop.map(p=>p.clone().multiply(S));
  for(let i=1;i<L.length-1;i++)for(const p of [L[0],L[i],L[i+1]]){pos.push(p.x,p.y,p.z);nor.push(nn.x,nn.y,nn.z);}

export function facetPlanes(geometry){
 if(geometry.userData.facets)return geometry.userData.facets;
 const a=geometry.attributes.position,planes=[];
 for(let i=0;i<a.count;i+=3){
  const p=new THREE.Vector3().fromBufferAttribute(a,i),q=new THREE.Vector3().fromBufferAttribute(a,i+1),r=new THREE.Vector3().fromBufferAttribute(a,i+2);
  const normal=q.sub(p).cross(r.sub(p)).normalize(),d=normal.dot(p);
  if(!planes.some(w=>Math.abs(w.x-normal.x)+Math.abs(w.y-normal.y)+Math.abs(w.z-normal.z)+Math.abs(w.w-d)<.0001))planes.push(new THREE.Vector4(normal.x,normal.y,normal.z,d));

}

// ---------------------------------------------------------------------------
// Optics
// Per-pixel trace inside the convex stone: entrance Fresnel reflection,
// refraction at n=2.4175, internal bounces with exact dielectric Fresnel and
// total internal reflection, per-channel exit refraction (C/D/F indices) for
// restrained fire. Environment-only: neighbouring geometry is approximated by
// a gold "seat" term for light leaving through the pavilion of a set stone.
// Output is linear; tone mapping and sRGB conversion are applied once, by the
// renderer's standard chunks.
// ---------------------------------------------------------------------------
// Linear equivalent of the ring metal #E4E5E8 (rhodium white gold); used for the metal seat term inside set stones.
export const GOLD_LINEAR=Object.freeze([.776,.784,.807]);

export function diamondMaterial(geometry,environment,{bounces=7,dispersion=true,seat=0}={}){
 const planes=facetPlanes(geometry),radius=geometry.userData.radius||geometry.boundingSphere?.radius||1;
 const average=environment?.userData?.average||new THREE.Vector3(.5,.5,.5);
 const vertexShader=`
 uniform vec3 localCamera;
 varying vec3 vLocalPosition;varying vec3 vLocalNormal;varying vec3 vGemCamera;
 varying vec3 vBasisX;varying vec3 vBasisY;varying vec3 vBasisZ;
 void main(){
  vLocalPosition=position;vLocalNormal=normal;vGemCamera=localCamera;
  vBasisX=vec3(1,0,0);vBasisY=vec3(0,1,0);vBasisZ=vec3(0,0,1);
  vec4 p=vec4(position,1.0);
  #ifdef USE_INSTANCING
   vGemCamera=(inverse(instanceMatrix)*vec4(localCamera,1.0)).xyz;
   mat3 basis=mat3(instanceMatrix);
   vBasisX=normalize(basis[0]);vBasisY=normalize(basis[1]);vBasisZ=normalize(basis[2]);
   p=instanceMatrix*p;

 precision highp float;
 #define FACETS ${planes.length}
 #define BOUNCES ${bounces}

 uniform vec4 planes[FACETS];uniform sampler2D studioMap;uniform mat3 worldRotation;
 uniform float envLod;uniform float epsilon;uniform float seatAmount;uniform vec3 seatColor;uniform vec3 envAverage;
 varying vec3 vLocalPosition;varying vec3 vLocalNormal;varying vec3 vGemCamera;
 varying vec3 vBasisX;varying vec3 vBasisY;varying vec3 vBasisZ;
 const float PI=3.141592653589793;

  vec2 uv=vec2(atan(w.z,w.x)*(.5/PI)+.5,asin(clamp(w.y,-1.,1.))/PI+.5);

   if(R<1.){

     vec3 tr=refract(d,-n,${DIAMOND_IOR.red.toFixed(4)}),tb=refract(d,-n,${DIAMOND_IOR.blue.toFixed(4)});

/** Feeds camera position, rotation and a size-based environment blur to the stone shader. */

  const px=radius/Math.max(.001,cameraWorld.distanceTo(center))*(size.y*.5)/Math.tan(camera.fov*Math.PI/360);

  u.envLod.value=Math.min(4,Math.max(0,Math.log2(lodRef/Math.max(1,px))*.8));

export const STUDIO={

  {name:'key edge flag',phi:106,el:22,w:8,h:56,soft:2},
  {name:'low right flag',phi:10,el:-4,w:40,h:20,soft:5},
  {name:'right flag',phi:56,el:14,w:13,h:62,soft:2.5},
  {name:'key separator',phi:160,el:30,w:6,h:40,soft:1.5},
  {name:'back flag',phi:180,el:8,w:18,h:52,soft:3},
  {name:'left-back flag',phi:-100,el:14,w:30,h:72,soft:4}

};

// surround: brightness of the studio walls. Diamonds use the dark studio (contrast in the facets);
// metal gets the same lights and flags with brighter walls, as a real product set uses white cards.
// stone: diamond-photography variant: dimmer walls, deeper black flags and a ring of small
// hard pin lights, so facets break into crisp black/white contrast and scintillation.
export const STONE_PINS=Array.from({length:18},(_,i)=>({phi:-180+i*20+((i*37)%11),el:18+((i*53)%46),w:1.6+(i%3)*.6,h:1.6+(i%3)*.6,power:26+(i%4)*8,tint:[1,1,1],soft:.6}));
// metal: silver on graphite. Mid-grey walls are what read as "pale grey" in polished metal, so the walls
// drop and the band is wrapped by tall strip lights either side of the camera, an overhead strip and a
// low front card: the curve shows white highlights against deep reflections, with no flat grey zone.
export const METAL_STRIPS=[
 // Paired thin strips either side of the camera: polished metal shows several crisp lines with dark gaps.
 {name:'camera-left strip A',phi:58,el:10,w:4,h:84,power:9,tint:[.97,.985,1],soft:1.2},
 {name:'camera-left strip B',phi:72,el:16,w:2.5,h:70,power:7,tint:[1,1,1],soft:1},
 {name:'camera-right strip A',phi:122,el:10,w:4,h:84,power:9,tint:[.97,.985,1],soft:1.2},
 {name:'camera-right strip B',phi:108,el:16,w:2.5,h:70,power:7,tint:[1,1,1],soft:1},
 {name:'overhead strip A',phi:90,el:62,w:160,h:4,power:7,tint:[1,1,1],soft:1.5},
 {name:'overhead strip B',phi:90,el:78,w:200,h:3,power:5,tint:[1,1,1],soft:1.5},
 {name:'low front card',phi:90,el:-22,w:90,h:5,power:5,tint:[.97,.985,1],soft:2},
 {name:'floor bounce strip',phi:-90,el:-30,w:120,h:5,power:3.5,tint:[.97,.985,1],soft:2},
 {name:'back-left rim',phi:-60,el:10,w:4,h:70,power:7,tint:[.96,.98,1],soft:1.2},
 {name:'back-right rim',phi:-120,el:10,w:4,h:70,power:7,tint:[.96,.98,1],soft:1.2},
 // Banded light ceiling (replaces the uniform dome): up-facing surfaces show stepped highlights.
 {name:'ceiling band 1',phi:0,el:40,w:360,h:3.5,power:3.2,tint:[1,1,1],soft:1.5},
 {name:'ceiling band 2',phi:0,el:52,w:360,h:5,power:4.2,tint:[1,1,1],soft:2},
 {name:'ceiling band 3',phi:0,el:68,w:360,h:4,power:3.6,tint:[1,1,1],soft:2},
 {name:'ceiling band 4',phi:0,el:84,w:360,h:5,power:2.6,tint:[1,1,1],soft:2},
 // Soft graded cards left and right of the set: lift the shank sides out of black without flattening them.
 {name:'left graded card',phi:20,el:-6,w:34,h:40,power:2,tint:[.97,.985,1],soft:10},
 {name:'right graded card',phi:160,el:-6,w:34,h:40,power:2,tint:[.97,.985,1],soft:10},
 // Large diffused wall behind the camera: the band faces it in every full-ring shot. Its diffuser falloff
 // (bright core, dim rim) gives the shank a silver gradient instead of black or flat grey.
 {name:'behind-camera diffusion',phi:90,el:2,w:150,h:60,power:2.4,tint:[.97,.985,1],soft:18},
 {name:'below-camera diffusion',phi:90,el:-38,w:150,h:26,power:1.6,tint:[.97,.985,1],soft:14}];
export function makeStudioMap({width=2048,surround=1,stone=false,metal=false}={}){
 const lights=stone?[...STUDIO.lights,...STONE_PINS]:metal?[...STUDIO.lights,...METAL_STRIPS]:STUDIO.lights,flagDepth=stone?.9:metal?.985:.96;
 const height=width/2,data=new Float32Array(width*height*4);
 const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
 const wrap=d=>((d+180)%360+360)%360-180;
 const mask=(phi,el,b)=>{const dx=Math.abs(wrap(phi-b.phi)),dy=Math.abs(el-b.el),hw=b.w/2,hh=b.h/2;if(dx>hw+b.soft||dy>hh+b.soft)return 0;return (1-sm(hw-b.soft,hw+b.soft,dx))*(1-sm(hh-b.soft,hh+b.soft,dy));};
 const avg=[0,0,0];let wsum=0;
 for(let y=0;y<height;y++){
  const el=((y+.5)/height-.5)*180,cw=Math.cos(el*DEG);
  const L0=surround*(el<0?.22+.26*sm(-35,0,el):.42+.40*sm(15,80,el)),warm=el<0?[1,.96,.9]:[1,.975,.94];
  // The overhead dome is one uniform bright cap: in polished metal every up-facing surface mirrors it as
  // flat light grey. The metal studio keeps only a faint dome and relies on the overhead strips instead.
  const over=(metal?.12:1)*STUDIO.overhead.power*sm(STUDIO.overhead.from,STUDIO.overhead.to,el);
  for(let x=0;x<width;x++){
   const phi=((x+.5)/width-.5)*360;let L=L0;
   // Metal: walls are never one even tone. A slow luminance gradient (darker toward the camera side,
   // soft bright/dark panels around the set) means any patch of polished metal reflects a gradient
   // instead of a flat light-grey field.
   if(metal){const w=.5+.5*Math.sin(phi*DEG*3+el*DEG*2.2),v=.5+.5*Math.cos(phi*DEG*5-el*DEG*1.3);L*=.18+.82*w*w*(.55+.45*v)*(.6+.4*Math.abs(Math.sin(phi*DEG*.5)));}
   for(const f of STUDIO.flags){const m=mask(phi,el,f);if(m)L*=1-flagDepth*m;}
   const c=[L*warm[0]+over,L*warm[1]+over,L*warm[2]+over*.98];
   for(const l of lights){const m=mask(phi,el,l);if(!m)continue;const dx=wrap(phi-l.phi)/(l.w/2),dy=(el-l.el)/(l.h/2),big=metal&&l.w*l.h>400;
    // Large softboxes get a real diffuser falloff (bright core, dim edges, brighter top) in the metal studio, so broad faces show a gradient, not a flat tone.
    const shape=big?Math.max(0,1-.85*Math.min(1,dx*dx+dy*dy))*(.55+.45*Math.max(0,Math.min(1,dy*.5+.5)))*.75:1-.28*Math.min(1,dx*dx+dy*dy);for(let i=0;i<3;i++)c[i]+=l.power*l.tint[i]*m*shape;}
   const k=(y*width+x)*4;data[k]=c[0];data[k+1]=c[1];data[k+2]=c[2];data[k+3]=1;
   avg[0]+=c[0]*cw;avg[1]+=c[1]*cw;avg[2]+=c[2]*cw;wsum+=cw;
  }
 }
 // Box-filtered mip chain, sampled explicitly by the stone shader (textureLod).
 const levels=[{data,width,height}];
 while(levels.length<7){
  const p=levels[levels.length-1],w=p.width>>1,h=p.height>>1,d=new Float32Array(w*h*4);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)for(let c=0;c<4;c++){const s=(i,j)=>p.data[((2*y+j)*p.width+2*x+i)*4+c];d[(y*w+x)*4+c]=(s(0,0)+s(1,0)+s(0,1)+s(1,1))*.25;}
  levels.push({data:d,width:w,height:h});
 }
 const half=levels.map(l=>{const o=new Uint16Array(l.data.length);for(let i=0;i<o.length;i++)o[i]=THREE.DataUtils.toHalfFloat(l.data[i]);return {data:o,width:l.width,height:l.height};});
 const map=new THREE.DataTexture(half[0].data,width,height,THREE.RGBAFormat,THREE.HalfFloatType);
 map.mipmaps=half;map.generateMipmaps=false;map.colorSpace=THREE.LinearSRGBColorSpace;
 map.mapping=THREE.EquirectangularReflectionMapping;map.minFilter=THREE.LinearMipmapLinearFilter;map.magFilter=THREE.LinearFilter;map.wrapS=THREE.RepeatWrapping;map.needsUpdate=true;
 map.userData.average=new THREE.Vector3(avg[0]/wsum,avg[1]/wsum,avg[2]/wsum);
 return map;
}

<script type="text/plain" id="m-ring-model">import * as THREE from 'three';
import {brilliantGeometry,diamondMaterial,bindDiamond,GOLD_LINEAR} from 'aurelle/diamond.js';

// One scale system for every part: 1 scene unit ≈ 8.6 mm.
// Inner Ø ≈ 16.1 mm (≈ US 5½–6), band 1.8 → 2.6 mm wide, 1.25 → 1.6 mm thick,
// centre oval ≈ 8.7 × 6.3 mm, pavé ≈ 0.46 mm. Visual reference only.
export const MM_PER_UNIT=8.6;
export const STONE=Object.freeze({rx:.505,rz:.365,y:1.45});
export const PAVE=Object.freeze({radius:.027,perSide:14,row:.039,start:.851,step:.0625,channel:.072,depth:.009,bead:.0095,beadSpread:.011});
export const PRONG_ANGLES=Object.freeze([40,140,220,320]);

const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const topWeight=a=>{const s=Math.max(0,Math.sin(a));return s*s;};
export const halfWidth=a=>.105+.045*topWeight(a);
export const halfThickness=a=>.08+.022*topWeight(a);
const INNER=.8;  // comfort-fit inner dome, relative to the outer dome height
const dome=t=>Math.pow(Math.max(0,1-Math.pow(Math.min(1,Math.abs(t)),4)),.25);
function shoulder(a){a=((a%(2*Math.PI))+2*Math.PI)%(2*Math.PI);if(a>Math.PI)return -1;return a<=Math.PI/2?a:Math.PI-a;}
export function channelDepth(a){
 const s=shoulder(a);if(s<0)return 0;
 const a0=PAVE.start-PAVE.step*(PAVE.perSide-1)-.035,a1=PAVE.start+.035;
 return PAVE.depth*sm(a0-.03,a0+.005,s)*(1-sm(a1-.005,a1+.03,s));
}
/** Radial offset of the outer surface from the r=1 centre circle (includes the pavé channel). */
export function outerOffset(a,z){
 const w=halfWidth(a),inChannel=1-sm(PAVE.channel-.0025,PAVE.channel+.0025,Math.abs(z));
 return halfThickness(a)*dome(z/w)-channelDepth(a)*inChannel;
}

function bandGeometry(major=720,uniform=80,wall=10){
 const pos=[];let ring=0;
 for(let i=0;i<major;i++){
  const a=i/major*Math.PI*2,w=halfWidth(a),h=halfThickness(a),bs=[];
  for(let j=0;j<uniform;j++)bs.push(-Math.PI+j/uniform*Math.PI*2);
  // Extra samples across both channel walls keep the bright-cut edges crisp.
  for(let j=0;j<wall;j++){const z=PAVE.channel-.005+.01*j/(wall-1),b=Math.asin(Math.min(1,(z/w)*(z/w)));bs.push(b,-b);}
  bs.sort((x,y)=>x-y);ring=bs.length;
  for(const b of bs){
   const s=Math.sin(b),c=Math.cos(b),z=w*Math.sign(s)*Math.sqrt(Math.abs(s));
   const r=c>=0?outerOffset(a,z):-INNER*h*Math.pow(Math.abs(c),2/3);
   pos.push((1+r)*Math.cos(a),(1+r)*Math.sin(a),z);
  }
 }
 const idx=[];
 for(let i=0;i<major;i++)for(let j=0;j<ring;j++){
  const A=i*ring+j,B=((i+1)%major)*ring+j,C=i*ring+(j+1)%ring,D=((i+1)%major)*ring+(j+1)%ring;
  idx.push(A,B,C,B,D,C);
 }
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return g;
}

/** Swept tube with a radius profile, analytic normals and an optional rounded tip. */
function sweepGeometry(points,radiusAt,{segments=64,radial=20,closed=false,tip=false}={}){
 const curve=new THREE.CatmullRomCurve3(points,closed,'centripetal'),frames=curve.computeFrenetFrames(segments,closed);
 const pos=[],nor=[],idx=[],rings=[];const P=new THREE.Vector3(),n=new THREE.Vector3();
 const ringCount=closed?segments:segments+1;
 for(let i=0;i<ringCount;i++){const t=i/segments;rings.push({p:curve.getPointAt(t),r:radiusAt(t),N:frames.normals[i],B:frames.binormals[i],T:frames.tangents[i],k:1,lift:0});}
 if(tip){const e=rings[rings.length-1];for(let m=1;m<=7;m++){const f=m/7*Math.PI/2;rings.push({...e,p:e.p.clone().addScaledVector(e.T,e.r*Math.sin(f)),k:Math.cos(f),lift:Math.sin(f)});}}
 for(const R of rings)for(let k=0;k<radial;k++){
  const th=k/radial*Math.PI*2;n.copy(R.N).multiplyScalar(Math.cos(th)).addScaledVector(R.B,Math.sin(th));
  P.copy(R.p).addScaledVector(n,R.r*R.k);pos.push(P.x,P.y,P.z);
  n.multiplyScalar(Math.sqrt(1-R.lift*R.lift)).addScaledVector(R.T,R.lift).normalize();nor.push(n.x,n.y,n.z);
 }
 const L=rings.length,last=closed?L:L-1;
 for(let i=0;i<last;i++)for(let k=0;k<radial;k++){const A=i*radial+k,C=i*radial+(k+1)%radial,B=((i+1)%L)*radial+k,D=((i+1)%L)*radial+(k+1)%radial;idx.push(A,C,B,C,D,B);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));g.setIndex(idx);return g;
}

/** Polished champagne gold. Roughness micro-variation and head occlusion are evaluated in ring space. */
// Elegant silver finish: rhodium-plated white gold, #E4E5E8 (sRGB, converted to linear by three).
export function goldMaterial({name='Polished_rhodium_white_gold',roughness=.045,polish=true,tint=1}={}){
 const m=new THREE.MeshPhysicalMaterial({name,color:0xE4E5E8,metalness:1.0,roughness,clearcoat:0.0,envMapIntensity:1});
 if(tint!==1)m.color.multiplyScalar(tint);
 if(!polish)return m;
 m.onBeforeCompile=shader=>{
  shader.vertexShader=shader.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vRingPos;').replace('#include <begin_vertex>',`#include <begin_vertex>
  vec4 aurelleP=vec4(transformed,1.0);
  #ifdef USE_INSTANCING
   aurelleP=instanceMatrix*aurelleP;
  #endif
  vRingPos=aurelleP.xyz;`);
  shader.fragmentShader=shader.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vRingPos;').replace('#include <roughnessmap_fragment>',`#include <roughnessmap_fragment>
  float aRad=length(vRingPos.xy);
  float aInner=1.0-smoothstep(.95,.985,aRad);
  // Fine polishing lines following the shank; faded out by screen footprint so they never alias.
  float aPhase=vRingPos.z*1150.0+sin(atan(vRingPos.y,vRingPos.x)*38.0)*2.0;
  float aFade=1.0-smoothstep(.35,1.1,fwidth(aPhase));
  float aLow=sin(vRingPos.x*9.0+vRingPos.y*5.0)*sin(vRingPos.z*31.0+vRingPos.y*7.0);
  roughnessFactor=clamp(roughnessFactor+aInner*.03+(sin(aPhase)*.5+.5)*aFade*.03+aLow*.012,.03,.3);`).replace('#include <aomap_fragment>',`
  float aQ=length(vec2(vRingPos.x/.42,vRingPos.z/.30));
  float aHead=(1.0-smoothstep(.45,.9,aQ))*smoothstep(.9,1.04,vRingPos.y)*(1.0-smoothstep(1.3,1.42,vRingPos.y));
  reflectedLight.indirectSpecular*=1.0-.45*aHead;
  #include <aomap_fragment>`);
 };
 m.customProgramCacheKey=()=>'aurelle-gold-v8.3';
 return m;
}

export function createRing({environment=null,highQuality=true,bounces=8,paveBounces=3,dispersion=true}={}){
 const root=new THREE.Group();root.name='Aurelle_Atelier_Ring';
 const metal=new THREE.Group();metal.name='Setting_and_band';root.add(metal);
 const gold=goldMaterial();
 const seatGold=goldMaterial({name:'Recessed_pave_seats',roughness:.1,polish:false,tint:.8});
 const basicStone=new THREE.MeshPhysicalMaterial({name:'Pave_diamond_fallback',color:'#ffffff',metalness:0,roughness:.02,transmission:.94,thickness:.04,ior:2.417,dispersion:.025,envMapIntensity:1.3});

 const band=new THREE.Mesh(bandGeometry(),gold);band.name='Tapered_comfort_fit_band';metal.add(band);

 // Crossover (bypass) head. Built like a cast setting rather than bent wire:
 // - each strand starts buried inside the shank and rises out of the band top as a raised ridge,
 // - front and back strands cross in a low X that rests on the band (no floating gap),
 // - claws are ≈1.1 mm at the base tapering to ≈0.6 mm, hooked over the crown just above the girdle,
 // - an under-girdle rail ties the four claws together, as a real basket would.
 const G=deg=>{const t=deg*Math.PI/180;return [STONE.rx*Math.cos(t),STONE.rz*Math.sin(t)];};
 const at=(k,y,deg)=>{const [x,z]=G(deg);return new THREE.Vector3(x*k,y,z*k);};
 const onBand=(a,r,z)=>new THREE.Vector3(r*Math.cos(a),r*Math.sin(a),z);
 const Y=STONE.y,ROOT=.66;   // root angle from the top; the pavé starts beyond it
 const STRANDS=[[-1,1,40],[1,1,140],[1,-1,220],[-1,-1,320]];   // [root side, face, claw angle]
 STRANDS.forEach(([sx,zs,deg],i)=>{
  const zc=sx<0?.35:.2;
  const pts=[
   onBand(Math.PI/2-sx*ROOT,1.0,zs*.05),
   onBand(Math.PI/2-sx*ROOT*.62,1.085,zs*.10),
   onBand(Math.PI/2-sx*ROOT*.22,1.15,zs*zc),
   new THREE.Vector3(-sx*.10,1.17,zs*zc),
   at(.92,Y-.13,deg),at(1.075,Y-.02,deg),at(1.07,Y+.025,deg),at(1.02,Y+.045,deg),at(.97,Y+.05,deg)];
  const g=sweepGeometry(pts,t=>.062-.028*sm(.3,.9,t),{segments:160,radial:28,tip:true});
  const claw=new THREE.Mesh(g,gold);claw.name='Claw_'+(i+1);metal.add(claw);
 });
 {const pts=[];for(let k=0;k<64;k++)pts.push(at(.9,Y-.1,k/64*360));
  const rail=new THREE.Mesh(sweepGeometry(pts,()=>.022,{segments:192,radial:18,closed:true}),gold);rail.name='Under_girdle_rail';metal.add(rail);}

 // Pavé: two rows per shoulder in a bright-cut channel, each stone held by four beads.
 const smallGeo=brilliantGeometry(PAVE.radius,PAVE.radius,{detailed:false});
 const paveMaterial=environment&&highQuality?diamondMaterial(smallGeo,environment,{bounces:paveBounces,dispersion,seat:1}):basicStone;
 const count=PAVE.perSide*2*2,beadCount=(PAVE.perSide+1)*4*2;
 const stones=new THREE.InstancedMesh(smallGeo,paveMaterial,count);stones.name=`Pave_${count}_stones`;
 if(paveMaterial.isShaderMaterial)bindDiamond(stones,{radius:PAVE.radius});
 const seatGeo=new THREE.LatheGeometry([new THREE.Vector2(PAVE.radius*1.22,-.0012),new THREE.Vector2(PAVE.radius*1.08,.0004),new THREE.Vector2(PAVE.radius*1.0,.0012)],28);
 seatGold.side=THREE.DoubleSide;
 const seats=new THREE.InstancedMesh(seatGeo,seatGold,count);seats.name='Individual_pave_seats';
 const beadGeo=new THREE.SphereGeometry(PAVE.bead,16,12);beadGeo.scale(1,.85,1);
 const beads=new THREE.InstancedMesh(beadGeo,gold,beadCount);beads.name='Pave_gold_beads';
 const M=new THREE.Matrix4(),X=new THREE.Vector3(),Yv=new THREE.Vector3(),Z=new THREE.Vector3(0,0,1);
 const frame=(a,z,lift)=>{const r=1+outerOffset(a,z)+lift;X.set(Math.sin(a),-Math.cos(a),0);Yv.set(Math.cos(a),Math.sin(a),0);M.makeBasis(X,Yv,Z).setPosition(r*Math.cos(a),r*Math.sin(a),z);return M;};
 const angle=(side,s)=>side===1?s:Math.PI-s;
 let si=0,bi=0;
 for(const side of [-1,1]){
  for(let i=0;i<PAVE.perSide;i++){
   const a=angle(side,PAVE.start-i*PAVE.step);
   for(const row of [-1,1]){stones.setMatrixAt(si,frame(a,row*PAVE.row,.0005));seats.setMatrixAt(si++,frame(a,row*PAVE.row,0));}
  }
  for(let i=0;i<=PAVE.perSide;i++){
   const a=angle(side,PAVE.start-(i-.5)*PAVE.step);
   for(const z of [-PAVE.row-PAVE.beadSpread,-PAVE.row+PAVE.beadSpread,PAVE.row-PAVE.beadSpread,PAVE.row+PAVE.beadSpread])beads.setMatrixAt(bi++,frame(a,z,.0028));
  }
 }
 stones.instanceMatrix.needsUpdate=seats.instanceMatrix.needsUpdate=beads.instanceMatrix.needsUpdate=true;
 for(const m of [stones,seats,beads])m.computeBoundingSphere();
 metal.add(seats,beads,stones);

 const geometry=brilliantGeometry(STONE.rx,STONE.rz);
 const material=environment&&highQuality?diamondMaterial(geometry,environment,{bounces,dispersion,seat:1}):new THREE.MeshPhysicalMaterial({name:'Primary_diamond_fallback',color:'#ffffff',roughness:.015,metalness:0,transmission:.96,thickness:.45,ior:2.417,dispersion:.025});
 const centerStone=new THREE.Mesh(geometry,material);centerStone.position.y=STONE.y;centerStone.name='Center_oval_diamond';
 if(material.isShaderMaterial)bindDiamond(centerStone);root.add(centerStone);
 root.userData.parts={metal,centerStone,band,gold,seatGold,basicStone,stones,seats,beads};
 root.userData.stoneY=STONE.y;
 return root;
}
</script>
<script type="text/plain" id="m-motion">export const CHAPTERS = [
 {id:'first-light',en:'First light',idLabel:'Kilau pertama',titleEn:'Light, kept<br>for a <em>lifetime.</em>',titleId:'Cahaya yang<br>dijaga <em>selamanya.</em>',bodyEn:'Every Aurelle piece begins with a single stone and the light it was made to hold.',bodyId:'Setiap karya Aurelle berawal dari satu batu, dan cahaya yang ditakdirkan untuk ia simpan.',captionEn:'AURELLE · LUXURY JEWELRY',captionId:'AURELLE · LUXURY JEWELRY'},

<script type="text/plain" id="m-scene">import * as THREE from 'three';
import {createRing} from 'aurelle/ring-model.js';
import {brilliantGeometry,diamondMaterial,bindDiamond,makeStudioMap} from 'aurelle/diamond.js';
import {sampleMotion} from 'aurelle/motion.js';

// Shots in motion.js were authored for a 34° lens. A longer macro lens keeps
// the same framing at a greater distance, removing wide-angle distortion.
const AUTHORED_FOV=34;
const LENS={desktop:24,mobile:27};
const lensFactor=fov=>Math.tan(AUTHORED_FOV*Math.PI/360)/Math.tan(fov*Math.PI/360);
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};

export function mountShowroom(host,{onError=()=>{}}={}){
 let renderer;try{renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance',preserveDrawingBuffer:!!globalThis.AURELLE_CAPTURE});}catch(e){onError(e);return null;}
 const small=innerWidth<760;
 const ratio=low=>Math.min(devicePixelRatio||1,low?1:small?1.5:2);
 renderer.setPixelRatio(ratio(false));
 // Linear shading -> Khronos PBR Neutral tone map -> sRGB, applied once for every material.
 renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NeutralToneMapping;renderer.toneMappingExposure=1.0;renderer.setClearColor(0xffffff,0);

 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(LENS.desktop,1,.05,100);

 // Metal is lit by the bright product studio (PMREM). Stones trace a diamond-photography version of the
// same set: same softboxes and flags, dimmer walls, deeper flags, extra hard pin lights.
 const metalStudio=makeStudioMap({width:2048,surround:.7,metal:true});
 const pmrem=new THREE.PMREMGenerator(renderer),envRT=pmrem.fromEquirectangular(metalStudio);pmrem.dispose();metalStudio.dispose();scene.environment=envRT.texture;
 const studio=makeStudioMap({width:small?1024:2048,surround:.55,stone:true});

 const fragData=[];for(let i=0;i<FRAGMENTS;i++){const angle=i*2.399963,rad=.7+(i%3)*.2;fragData.push({angle,size:.045+(i%4)*.02,base:new THREE.Vector3(.4+Math.cos(angle)*rad,1.95+Math.sin(angle)*.55,(i%5-2)*.4)});}

 const target=new THREE.Vector3(),offset=new THREE.Vector3();

 function draw(){pending=false;if(disposed||(!globalThis.AURELLE_CAPTURE&&(!visible||document.hidden)))return;
  const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;
  const mobile=w<760,m=sampleMotion(progress,mobile),fov=mobile?LENS.mobile:LENS.desktop;
  if(camera.fov!==fov){camera.fov=fov;camera.updateProjectionMatrix();}
  ring.rotation.set(...m.rotation);centerStone.position.y=stoneY+m.lift;
  // Light leaving the pavilion meets the gold setting only once the stone is seated.
  const seated=1-sm(0,.22,m.lift);for(const s of [variants.high,variants.low])s.center.uniforms.seatAmount.value=seated*.55;
  ring.updateMatrixWorld(true);target.set(...m.target).applyMatrix4(ring.matrixWorld);

  camera.position.copy(target).add(offset);camera.lookAt(target);
  camera.setViewOffset(w,h,-w*m.align,mobile?h*.19:0,w,h);
  fragments.visible=m.cloud>.01;
  if(fragments.visible){
   fragData.forEach((f,i)=>{
    dummy.position.copy(f.base);dummy.position.x+=Math.sin(progress*3+f.angle)*.25;dummy.position.z+=progress*.6;
    dummy.rotation.set(f.angle+progress*1.2,f.angle*.6-progress*.8,progress*.6+f.angle);dummy.scale.setScalar(f.size*m.cloud);
    dummy.updateMatrix();fragments.setMatrixAt(i,dummy.matrix);
   });

  }

 }

 function resize(){if(disposed)return;const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();requestDraw();}
 function lost(e){e.preventDefault();onError(new Error('WebGL context lost'));}

 renderer.domElement.addEventListener('webglcontextlost',lost);document.addEventListener('visibilitychange',visibility);
 const ro=new ResizeObserver(resize);ro.observe(host);const io=new IntersectionObserver(e=>{visible=e[0].isIntersecting;if(visible)requestDraw();});io.observe(host);resize();
 return {
  setProgress(v){const next=Math.min(1,Math.max(0,v));if(next===progress)return;progress=next;requestDraw();},
  setQuality(low){quality=low?'low':'high';apply();renderer.setPixelRatio(ratio(low));resize();},
  renderNow(){pending=false;cancelAnimationFrame(frame);draw();return renderer.domElement;},
  dispose(){disposed=true;cancelAnimationFrame(frame);ro.disconnect();io.disconnect();document.removeEventListener('visibilitychange',visibility);renderer.domElement.removeEventListener('webglcontextlost',lost);
   const geos=new Set(),mats=new Set();for(const s of Object.values(variants))for(const m of Object.values(s))mats.add(m);
   scene.traverse(o=>{if(o.geometry)geos.add(o.geometry);if(o.material)mats.add(o.material);});
   geos.forEach(g=>g.dispose());mats.forEach(m=>m.dispose());fragments.dispose();envRT.dispose();studio.dispose();renderer.dispose();renderer.domElement.remove();}
 };
}

<script type="text/plain" id="m-experience">import gsap from 'gsap';
import {ScrollTrigger} from 'gsap/ScrollTrigger';
import {mountShowroom} from 'aurelle/scene.js';
import {CHAPTERS} from 'aurelle/motion.js';
const lastChapter=CHAPTERS.length-1;
gsap.registerPlugin(ScrollTrigger);
const ui={id:{enterNav:'<span>Masuk ke</span><span>Store</span>',enter:'Masuk ke Store',scroll:'SCROLL UNTUK MENJELAJAH',replay:'Ulangi perjalanan',motion:'Kurangi gerakan',enable:'Aktifkan gerakan',quality:'Detail tinggi',light:'Mode ringan',index:'Jelajahi adegan',close:'Tutup',fallback:'Pratinjau 3D tidak tersedia pada perangkat ini.',endTitle:'Dibuat untuk<br>momen yang <em>tak terlupa.</em>',endBody:'Cincin tunangan, cincin pernikahan, dan perhiasan fine jewelry, dikerjakan dengan detail yang sama.'},en:{enterNav:'<span>Enter</span><span>the Store</span>',enter:'Enter the Store',scroll:'SCROLL TO DISCOVER',replay:'Replay the journey',motion:'Reduce motion',enable:'Enable motion',quality:'High detail',light:'Light mode',index:'Explore the scenes',close:'Close',fallback:'The 3D preview is unavailable on this device.',endTitle:'Made for the moments<br>you <em>keep.</em>',endBody:'Engagement rings, wedding bands and fine jewelry, made with the same attention to detail.'}};

export function initExperience(root,{storeUrl='./store.html'}={}){
 let language='id',simple=matchMedia('(prefers-reduced-motion: reduce)').matches,low=false,timeline,trigger,scene,active=-1,menuOpen=false;
 const stage=root.querySelector('.showroom'),canvas=root.querySelector('.scene'),status=root.querySelector('.status'),media=matchMedia('(prefers-reduced-motion: reduce)');
 const title=root.querySelector('[data-title]'),body=root.querySelector('[data-body]'),eyebrow=root.querySelector('[data-eyebrow]'),copyWrap=root.querySelector('.scene-copy');
 const counter=root.querySelector('[data-counter]'),label=root.querySelector('[data-label]'),indicator=root.querySelector('.progress-fill'),motionButton=root.querySelector('[data-motion]'),qualityButton=root.querySelector('[data-quality]');
 const menuButton=root.querySelector('[data-index]'),drawer=root.querySelector('.scene-index'),closeButton=root.querySelector('[data-close]');
 const listeners=[];function listen(el,type,f){if(!el)return;el.addEventListener(type,f);listeners.push(()=>el.removeEventListener(type,f));}
 try{language=localStorage.getItem('aurelle-language')==='en'?'en':'id';}catch{}
 root.querySelectorAll('[data-store]').forEach(a=>a.href=storeUrl);
 const nav=root.querySelector('.scene-list');nav.innerHTML=CHAPTERS.map((c,i)=>`<button type="button" data-jump="${i}"><span>${String(i+1).padStart(2,'0')}</span><span data-scene-name="${i}"></span><span aria-hidden="true">↗</span></button>`).join('');
 const dots=root.querySelector('.chapter-dots');if(dots)dots.innerHTML=CHAPTERS.map((c,i)=>`<button type="button" data-jump="${i}" class="chapter-dot"><span class="sr-only" data-scene-name="${i}"></span></button>`).join('');
 function paintChapter(index){active=index;const c=CHAPTERS[index];title.innerHTML=language==='id'?c.titleId:c.titleEn;body.textContent=language==='id'?c.bodyId:c.bodyEn;eyebrow.textContent=language==='id'?c.captionId:c.captionEn;if(label)label.textContent=language==='id'?c.idLabel:c.en;counter.textContent=String(index+1).padStart(2,'0');root.querySelectorAll('[data-jump]').forEach(b=>{b.setAttribute('aria-current',Number(b.dataset.jump)===index?'step':'false');});}
 function languageChange(lang){language=lang;root.setAttribute('lang',lang);try{localStorage.setItem('aurelle-language',lang);}catch{}root.querySelectorAll('[data-ui]').forEach(el=>el.innerHTML=ui[lang][el.dataset.ui]??'');root.querySelectorAll('[data-language]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.language===lang)));root.querySelectorAll('[data-scene-name]').forEach(el=>{const c=CHAPTERS[Number(el.dataset.sceneName)];el.textContent=lang==='id'?c.idLabel:c.en;});motionButton.textContent=simple?ui[lang].enable:ui[lang].motion;qualityButton.textContent=low?ui[lang].light:ui[lang].quality;paintChapter(Math.max(0,active));}
 root.querySelectorAll('[data-language]').forEach(el=>listen(el,'click',()=>languageChange(el.dataset.language)));
 function openMenu(open){menuOpen=open;drawer.hidden=!open;menuButton.setAttribute('aria-expanded',String(open));if(open){closeButton.focus();}else menuButton.focus();}
 listen(menuButton,'click',()=>openMenu(!menuOpen));listen(closeButton,'click',()=>openMenu(false));
 listen(drawer,'keydown',e=>{if(e.key==='Escape')openMenu(false);if(e.key==='Tab'){const focusable=Array.from(drawer.querySelectorAll('button'));const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
 const state={p:0};
 function update(){const p=state.p;scene?.setProgress(p);if(indicator)indicator.style.transform=`scaleX(${p})`;
 const raw=p*lastChapter,index=Math.min(lastChapter,Math.round(raw));if(index!==active)paintChapter(index);
 const distance=Math.abs(raw-index);// The last segment ends inside the diamond (full-screen POV): copy yields to the stone.
 const handoff=gsap.utils.clamp(0,1,(p-(lastChapter-.55)/lastChapter)/(.4/lastChapter));
 const opacity=simple?1:(1-gsap.utils.clamp(0,.92,(distance-.22)/.27))*(1-handoff);copyWrap.style.opacity=String(opacity);copyWrap.style.setProperty('--copy-y',`${(1-opacity)*12}px`);
 root.dataset.scene=String(index);root.style.setProperty('--progress',String(p));root.style.setProperty('--pov',String(simple?0:handoff));
 }
 function setup(){timeline?.kill();trigger?.kill();timeline=null;trigger=null;root.classList.toggle('simple-motion',simple);
 if(simple){state.p=(lastChapter-2)/lastChapter;update();} // calm full-ring view; the final pose is a full-screen macro
 else{state.p=0;timeline=gsap.timeline({scrollTrigger:{trigger:stage,pin:true,start:'top top',end:()=>`+=${Math.round(innerHeight*lastChapter*(innerWidth<760?20/17:24/17))}`,scrub:true,anticipatePin:1,invalidateOnRefresh:true}});timeline.to(state,{p:1,duration:1,ease:'none',onUpdate:update});trigger=timeline.scrollTrigger;update();ScrollTrigger.refresh();}
 motionButton.textContent=simple?ui[language].enable:ui[language].motion;motionButton.setAttribute('aria-pressed',String(simple));
 }
 function fail(){root.classList.add('webgl-failed');status.textContent=ui[language].fallback;simple=true;if(scene)setup();}
 try{scene=mountShowroom(canvas,{onError:fail});}catch{fail();}
 if(scene)root.classList.add('three-ready');else{simple=true;fail();}
 listen(motionButton,'click',()=>{if(!scene)return;simple=!simple;setup();});listen(media,'change',e=>{simple=e.matches;setup();});
 listen(qualityButton,'click',()=>{low=!low;scene?.setQuality(low);qualityButton.textContent=low?ui[language].light:ui[language].quality;qualityButton.setAttribute('aria-pressed',String(low));});
 root.querySelectorAll('[data-jump]').forEach(b=>listen(b,'click',()=>{if(menuOpen)openMenu(false);if(simple){state.p=Number(b.dataset.jump)/lastChapter;update();return;}if(!trigger)return;window.scrollTo({top:trigger.start+(trigger.end-trigger.start)*Number(b.dataset.jump)/lastChapter,behavior:media.matches?'instant':'smooth'});}));
 root.querySelectorAll('[data-replay]').forEach(b=>listen(b,'click',()=>window.scrollTo({top:0,behavior:media.matches?'instant':'smooth'})));
 languageChange(language);setup();
 root.aurellePreview={show(p){state.p=Math.min(1,Math.max(0,p));update();scene?.renderNow?.();}};
 return ()=>{listeners.forEach(f=>f());timeline?.kill();trigger?.kill();scene?.dispose();root.classList.remove('three-ready','simple-motion','webgl-failed');};
}
</script>
<script type="text/plain" id="m-main">import {initExperience} from 'aurelle/experience.js';
import {showroomMarkup} from 'aurelle/markup.js';
const root=document.querySelector('#aurelle');
if(root){
 // Ambroise François Std is served by Adobe Fonts: pass the project kit id as data-typekit="abc1234".
 if(root.dataset.typekit&&!document.querySelector('link[data-aurelle-typekit]')){const l=document.createElement('link');l.rel='stylesheet';l.href=`https://use.typekit.net/${root.dataset.typekit}.css`;l.dataset.aurelleTypekit='';document.head.append(l);}
 if(!root.querySelector('.showroom'))root.innerHTML=showroomMarkup;
 // Self-contained builds expose inlined assets as window.__resources (blob URLs); dev/production use paths.
 const res=globalThis.__resources||{};
 root.querySelectorAll('[data-asset]').forEach(i=>{if(res.monogram)i.src=res.monogram;else if(root.dataset.assetBase)i.src=root.dataset.assetBase+i.dataset.asset;});
 const poster=root.querySelector('.poster');
 if(poster){if(res.poster)poster.src=res.poster;else if(root.dataset.poster)poster.src=root.dataset.poster;poster.addEventListener('error',()=>poster.remove(),{once:true});}
 initExperience(root,{storeUrl:root.dataset.storeUrl||'./store.html'});
}
</script>
