# Aurelle development database: Postgres only (production uses Supabase). Password comes from .env.
# The backend and the two websites run on your machine, not in Docker:
#   cd app/backend && venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
#   cd app/web/ecommerce && npm run dev -- --port 5173
#   cd app/web/dashboard && npm run dev -- --port 5174
#
#   docker compose up -d        start Postgres
#   docker compose down         stop; the database stays in the "postgres-data" volume
#
#   Shop:       http://localhost:5173
#   Dashboard:  http://localhost:5174
#   API:        http://localhost:8000   (docs at /api/docs)
#   Postgres:   localhost:5433          (user "aurelle", database "aurelle")
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: aurelle
      POSTGRES_DB: aurelle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # For the backend on this machine and its tests; not reachable from other machines.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurelle -d aurelle"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
